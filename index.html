<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex-Hub Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    .modal { transition: opacity 0.25s ease; }
    body.modal-active { overflow-x: hidden; overflow-y: hidden; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Navigation Bar -->
  <header class="bg-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <h1 class="text-2xl font-black tracking-wider text-purple-900 uppercase">Apex<span class="text-indigo-600">-Hub</span></h1>
      </div>
      <button id="adminToggleBtn" onclick="openAdminAuth()" class="bg-purple-700 hover:bg-purple-800 text-white font-semibold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow">
        <i class="fa-solid fa-user-shield"></i>
        <span>Admin Dashboard</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- Admin Control Panel (Hidden by Default) -->
    <section id="adminSection" class="hidden bg-white p-6 rounded-2xl shadow-lg border border-purple-100 mb-8">
      <div class="flex justify-between items-center mb-6 pb-3 border-b border-gray-100">
        <div>
          <h2 class="text-xl font-bold text-gray-900">Admin Control Center</h2>
          <p class="text-xs text-gray-500">Manage catalog inventory & settings</p>
        </div>
        <button onclick="closeAdminPanel()" class="text-gray-400 hover:text-gray-600 font-bold text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Add/Edit Product Form -->
      <form id="productForm" onsubmit="handleProductSubmit(event)" class="space-y-4">
        <input type="hidden" id="productId">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Product Title</label>
            <input type="text" id="prodTitle" required placeholder="e.g. Reki Digital Air Fryer" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Category</label>
            <select id="prodCategory" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm bg-white">
              <option value="KITCHEN APPLIANCES">KITCHEN APPLIANCES</option>
              <option value="HOME APPLIANCES">HOME APPLIANCES</option>
              <option value="ELECTRONICS">ELECTRONICS</option>
              <option value="FURNITURE">FURNITURE</option>
              <option value="ACCESSORIES">ACCESSORIES</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Price (KES)</label>
            <input type="number" id="prodPrice" required placeholder="5000" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Product Image</label>
            <div class="flex gap-2">
              <input type="url" id="prodImage" required placeholder="Paste Image URL or Upload Below" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm">
              <label for="cloudinaryFile" class="cursor-pointer bg-purple-600 hover:bg-purple-700 text-white font-semibold px-4 py-2 rounded-lg text-sm flex items-center justify-center shrink-0 shadow">
                <i class="fa-solid fa-upload mr-1"></i> Upload
              </label>
              <input type="file" id="cloudinaryFile" accept="image/*" class="hidden" onchange="uploadDirectImage(event)">
            </div>
            <p id="uploadStatus" class="text-xs text-indigo-600 mt-1 hidden"></p>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Description</label>
          <textarea id="prodDesc" rows="3" required placeholder="Describe product details..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm"></textarea>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" id="saveProdBtn" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-6 py-2.5 rounded-lg text-sm shadow transition flex-1">
            Publish Product
          </button>
          <button type="button" onclick="resetForm()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-4 py-2.5 rounded-lg text-sm transition">
            Clear Form
          </button>
        </div>
      </form>
    </section>

    <!-- Filters & Search -->
    <div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center">
      <div class="w-full md:w-72">
        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Search products..." class="w-full px-4 py-2 border rounded-xl shadow-sm focus:ring-2 focus:ring-purple-600 outline-none text-sm">
      </div>
      <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
        <button onclick="setCategoryFilter('ALL')" class="cat-btn bg-purple-700 text-white font-semibold px-4 py-2 rounded-xl text-xs shrink-0 shadow">All</button>
        <button onclick="setCategoryFilter('KITCHEN APPLIANCES')" class="cat-btn bg-white text-gray-600 hover:bg-purple-50 font-semibold px-4 py-2 rounded-xl text-xs shrink-0 shadow-sm border">Kitchen</button>
        <button onclick="setCategoryFilter('HOME APPLIANCES')" class="cat-btn bg-white text-gray-600 hover:bg-purple-50 font-semibold px-4 py-2 rounded-xl text-xs shrink-0 shadow-sm border">Home</button>
        <button onclick="setCategoryFilter('ELECTRONICS')" class="cat-btn bg-white text-gray-600 hover:bg-purple-50 font-semibold px-4 py-2 rounded-xl text-xs shrink-0 shadow-sm border">Electronics</button>
        <button onclick="setCategoryFilter('FURNITURE')" class="cat-btn bg-white text-gray-600 hover:bg-purple-50 font-semibold px-4 py-2 rounded-xl text-xs shrink-0 shadow-sm border">Furniture</button>
      </div>
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-600 border-t-transparent"></div>
        <p class="mt-2 text-sm text-gray-500">Loading live products...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-gray-400 text-center py-6 text-xs mt-auto">
    <p>&copy; Apex-Hub Kenya. All rights reserved.</p>
  </footer>

  <!-- Passcode Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-gray-900 mb-1">Admin Access Required</h3>
      <p class="text-xs text-gray-500 mb-4">Enter your passcode to manage products.</p>
      <input type="password" id="passcodeInput" placeholder="Enter Admin Passcode" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm mb-4">
      <div class="flex justify-end gap-2">
        <button onclick="closeAuthModal()" class="px-4 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
        <button onclick="verifyPasscode()" class="px-4 py-2 text-xs font-semibold bg-purple-700 text-white rounded-lg shadow hover:bg-purple-800">Unlock Dashboard</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      databaseURL: "https://apex-hub-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Cloudinary Config
    const CLOUDINARY_CLOUD_NAME = "c-f43b0cdb2f32fd4c8e7e174ff5bd67";
    const CLOUDINARY_PRESET = "apex_hub_preset";

    let rawProducts = {};
    let activeCategory = 'ALL';
    let isAdminAuthenticated = false;

    // Admin Auth
    function openAdminAuth() {
      if (isAdminAuthenticated) {
        document.getElementById('adminSection').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        document.getElementById('authModal').classList.remove('hidden');
      }
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('passcodeInput').value = '';
    }

    function verifyPasscode() {
      const pwd = document.getElementById('passcodeInput').value;
      if (pwd === "Milano254!+") {
        isAdminAuthenticated = true;
        closeAuthModal();
        document.getElementById('adminSection').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        alert("Incorrect passcode!");
      }
    }

    function closeAdminPanel() {
      document.getElementById('adminSection').classList.add('hidden');
    }

    // Direct Image Upload Handler
    async function uploadDirectImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('uploadStatus');
      statusEl.textContent = "Uploading image...";
      statusEl.classList.remove('hidden');

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_PRESET);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.secure_url) {
          document.getElementById('prodImage').value = data.secure_url;
          statusEl.textContent = "✓ Photo uploaded successfully!";
        } else {
          statusEl.textContent = "Upload failed. Check preset name.";
        }
      } catch (err) {
        statusEl.textContent = "Error uploading photo.";
      }
    }

    // Load Products
    db.ref('products').on('value', (snapshot) => {
      rawProducts = snapshot.val() || {};
      renderProducts();
    });

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      let keys = Object.keys(rawProducts);
      if (keys.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400">No products available.</div>';
        return;
      }

      keys.forEach(id => {
        const p = rawProducts[id];
        if (activeCategory !== 'ALL' && p.category !== activeCategory) return;
        if (searchTerm && !p.title.toLowerCase().includes(searchTerm) && !p.description.toLowerCase().includes(searchTerm)) return;

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition";
        card.innerHTML = `
          <div>
            <div class="relative h-48 bg-gray-50 flex items-center justify-center overflow-hidden">
              <span class="absolute top-3 left-3 bg-purple-700 text-white text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider">${p.category || 'General'}</span>
              <img src="${p.image}" alt="${p.title}" class="object-cover w-full h-full" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Not+Found'">
            </div>
            <div class="p-4">
              <h3 class="font-bold text-gray-900 text-base line-clamp-1 mb-1">${p.title}</h3>
              <p class="text-xs text-gray-500 line-clamp-2 mb-3">${p.description}</p>
            </div>
          </div>
          <div class="p-4 pt-0 border-t border-gray-50 flex items-center justify-between mt-auto">
            <div>
              <span class="text-[10px] uppercase text-gray-400 font-bold block">Price</span>
              <span class="text-base font-extrabold text-purple-900">KES ${Number(p.price).toLocaleString()}</span>
            </div>
            <div class="flex gap-2">
              ${isAdminAuthenticated ? `<button onclick="editProduct('${id}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 p-2 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button>` : ''}
              <a href="https://wa.me/254700000000?text=Hello%20Apex-Hub%20Kenya,%20I%20am%20interested%20in%20${encodeURIComponent(p.title)}" target="_blank" class="bg-purple-700 hover:bg-purple-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow">
                Order <i class="fa-brands fa-whatsapp"></i>
              </a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Submit Product (Add/Update)
    function handleProductSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('productId').value;
      const data = {
        title: document.getElementById('prodTitle').value,
        category: document.getElementById('prodCategory').value,
        price: document.getElementById('prodPrice').value,
        image: document.getElementById('prodImage').value,
        description: document.getElementById('prodDesc').value
      };

      if (id) {
        db.ref('products/' + id).update(data, () => resetForm());
      } else {
        db.ref('products').push(data, () => resetForm());
      }
    }

    function editProduct(id) {
      const p = rawProducts[id];
      if (!p) return;
      document.getElementById('productId').value = id;
      document.getElementById('prodTitle').value = p.title;
      document.getElementById('prodCategory').value = p.category;
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodImage').value = p.image;
      document.getElementById('prodDesc').value = p.description;
      document.getElementById('saveProdBtn').textContent = "Update Live Product";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('productForm').reset();
      document.getElementById('productId').value = '';
      document.getElementById('saveProdBtn').textContent = "Publish Product";
      document.getElementById('uploadStatus').classList.add('hidden');
    }

    function filterProducts() { renderProducts(); }
    function setCategoryFilter(cat) {
      activeCategory = cat;
      renderProducts();
    }
  </script>
</body>
</html>
