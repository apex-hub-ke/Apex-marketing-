<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex-Hub Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-black tracking-wider text-purple-900 uppercase">Apex<span class="text-gray-900">-Hub</span></h1>
      <button onclick="openAdminAuth()" class="bg-purple-700 hover:bg-purple-800 text-white font-semibold px-4 py-2 rounded-xl text-sm flex items-center gap-2 shadow-sm">
        <i class="fa-solid fa-user-shield"></i>
        <span>Admin Dashboard</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 py-4 flex-grow w-full space-y-4">

    <!-- Search Bar -->
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-purple-500 text-lg">
        <i class="fa-solid fa-magnifying-glass"></i>
      </span>
      <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Search products, inches, capacities..." class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-2xl shadow-sm text-sm outline-none focus:border-purple-600 transition">
    </div>

    <!-- Admin Panel -->
    <section id="adminSection" class="hidden bg-white p-5 rounded-2xl shadow-md border border-purple-100">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
        <h2 id="formHeaderTitle" class="text-base font-bold text-gray-900">Admin Control Center</h2>
        <button onclick="closeAdminPanel()" class="text-gray-400 hover:text-gray-600 font-bold p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="productForm" onsubmit="handleProductSubmit(event)" class="space-y-3">
        <input type="hidden" id="productId">
        
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Product Title</label>
          <input type="text" id="prodTitle" required placeholder="e.g. Nunix Coffee Maker" class="w-full px-3 py-2 border rounded-xl outline-none text-sm focus:border-purple-600">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Category</label>
          <select id="prodCategory" required onchange="toggleCustomCategory(this.value)" class="w-full px-3 py-2 border rounded-xl outline-none text-sm bg-white focus:border-purple-600">
            <option value="KITCHEN APPLIANCES">Kitchen Appliances</option>
            <option value="WASHING MACHINE">Washing Machine</option>
            <option value="HOME APPLIANCES">Home Appliances</option>
            <option value="ELECTRONICS">Electronics</option>
            <option value="FURNITURE">Furniture</option>
            <option value="CUSTOM">+ Add New Category...</option>
          </select>
          <input type="text" id="customCatInput" placeholder="Enter custom category name" class="hidden w-full mt-2 px-3 py-2 border rounded-xl outline-none text-sm focus:border-purple-600">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Price (KES)</label>
            <input type="number" id="prodPrice" required placeholder="3000" class="w-full px-3 py-2 border rounded-xl outline-none text-sm focus:border-purple-600">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Image URL</label>
            <input type="url" id="prodImage" placeholder="https://i.ibb.co/..." class="w-full px-3 py-2 border rounded-xl outline-none text-sm focus:border-purple-600">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Description</label>
          <textarea id="prodDesc" rows="2" required placeholder="Describe details, inches, capacity..." class="w-full px-3 py-2 border rounded-xl outline-none text-sm focus:border-purple-600"></textarea>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" id="saveProdBtn" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-4 py-2.5 rounded-xl text-sm shadow transition flex-1">
            Publish Product
          </button>
          <button type="button" onclick="resetForm()" class="bg-gray-100 text-gray-600 font-semibold px-3 py-2.5 rounded-xl text-sm transition">
            Clear
          </button>
        </div>
      </form>
    </section>

    <!-- Category Filter Bar -->
    <div id="filterBar" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
      <button onclick="setCategoryFilter('ALL')" class="cat-btn bg-purple-700 text-white font-bold px-4 py-1.5 rounded-xl text-xs shrink-0 shadow-sm">All</button>
    </div>

    <!-- Product Cards Grid -->
    <div id="productGrid" class="space-y-4">
      <div class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-600 border-t-transparent"></div>
        <p class="mt-2 text-xs text-gray-500">Loading catalog...</p>
      </div>
    </div>
  </main>

  <!-- Passcode Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <h3 class="text-base font-bold text-gray-900 mb-1">Admin Access Required</h3>
      <p class="text-xs text-gray-500 mb-4">Enter passcode to unlock admin features.</p>
      <input type="password" id="passcodeInput" placeholder="Enter Passcode" class="w-full px-3 py-2 border rounded-xl outline-none text-sm mb-4 focus:border-purple-600">
      <div class="flex justify-end gap-2">
        <button onclick="closeAuthModal()" class="px-4 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
        <button onclick="verifyPasscode()" class="px-4 py-2 text-xs font-semibold bg-purple-700 text-white rounded-lg shadow hover:bg-purple-800">Unlock</button>
      </div>
    </div>
  </div>

  <script>
    // EXACT REALTIME DATABASE URL FROM YOUR SCREENSHOT
    const DB_BASE = "https://apex-hub-c6d50-default-rtdb.firebaseio.com/products";
    let rawProducts = {};
    let activeCategory = 'ALL';
    let isAdminAuthenticated = false;

    function openAdminAuth() {
      if (isAdminAuthenticated) {
        document.getElementById('adminSection').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        document.getElementById('authModal').classList.remove('hidden');
      }
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('passcodeInput').value = '';
    }

    function verifyPasscode() {
      if (document.getElementById('passcodeInput').value === "Milano254!+") {
        isAdminAuthenticated = true;
        closeAuthModal();
        document.getElementById('adminSection').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderProducts();
      } else {
        alert("Incorrect passcode!");
      }
    }

    function closeAdminPanel() {
      document.getElementById('adminSection').classList.add('hidden');
      resetForm();
    }

    function toggleCustomCategory(val) {
      const customInput = document.getElementById('customCatInput');
      if (val === 'CUSTOM') {
        customInput.classList.remove('hidden');
        customInput.required = true;
      } else {
        customInput.classList.add('hidden');
        customInput.required = false;
      }
    }

    async function fetchProducts() {
      try {
        const res = await fetch(`${DB_BASE}.json`);
        const data = await res.json();
        rawProducts = data || {};
        updateFilterButtons();
        renderProducts();
      } catch (err) {
        document.getElementById('productGrid').innerHTML = '<div class="text-center py-12 text-gray-400 text-sm">Error connecting to database.</div>';
      }
    }

    function updateFilterButtons() {
      const filterBar = document.getElementById('filterBar');
      const categories = new Set(['KITCHEN APPLIANCES', 'WASHING MACHINE', 'HOME APPLIANCES', 'ELECTRONICS']);
      
      Object.values(rawProducts || {}).forEach(p => {
        if (p && p.category) categories.add(p.category.toUpperCase());
      });

      let buttonsHTML = `<button onclick="setCategoryFilter('ALL')" class="cat-btn ${activeCategory === 'ALL' ? 'bg-purple-700 text-white' : 'bg-white text-gray-600'} font-bold px-4 py-1.5 rounded-xl text-xs shrink-0 shadow-sm border border-gray-100">All</button>`;

      categories.forEach(cat => {
        buttonsHTML += `<button onclick="setCategoryFilter('${cat}')" class="cat-btn ${activeCategory === cat ? 'bg-purple-700 text-white' : 'bg-white text-gray-600'} font-bold px-4 py-1.5 rounded-xl text-xs shrink-0 shadow-sm border border-gray-100">${cat}</button>`;
      });

      filterBar.innerHTML = buttonsHTML;
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      let keys = Object.keys(rawProducts || {});

      keys = keys.filter(id => {
        const p = rawProducts[id];
        return p && p.title && String(p.title).trim() !== '';
      });

      if (keys.length === 0) {
        grid.innerHTML = '<div class="text-center py-12 text-gray-400 text-sm">No products found in database. Tap Admin Dashboard to publish!</div>';
        return;
      }

      keys.forEach(id => {
        const p = rawProducts[id];
        if (!p) return;

        const catUpper = (p.category || 'GENERAL').toUpperCase();

        if (activeCategory !== 'ALL' && catUpper !== activeCategory) return;
        if (searchTerm && !p.title.toLowerCase().includes(searchTerm) && !(p.description && p.description.toLowerCase().includes(searchTerm))) return;

        const imgSrc = p.image && p.image.trim() !== '' ? p.image : 'https://i.ibb.co/kgpDWKbw/1000006379.jpg';

        const adminControls = isAdminAuthenticated ? `
          <div class="flex gap-2 border-t pt-3 mt-3">
            <button onclick="editProduct('${id}')" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm flex-1">
              <i class="fa-solid fa-pen"></i> Edit
            </button>
            <button onclick="deleteProduct('${id}')" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm flex-1">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </div>
        ` : '';

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden p-3";
        card.innerHTML = `
          <div class="relative rounded-xl overflow-hidden bg-gray-50 mb-3 h-56 flex items-center justify-center">
            <span class="absolute top-3 left-3 bg-purple-800 text-white text-[10px] font-black px-2.5 py-1 rounded-md uppercase tracking-wider z-10">${catUpper}</span>
            <img src="${imgSrc}" alt="${p.title}" class="object-contain w-full h-full p-2" onerror="this.src='https://i.ibb.co/kgpDWKbw/1000006379.jpg'">
          </div>
          
          <div class="space-y-1">
            <h3 class="font-bold text-gray-900 text-base leading-snug">${p.title}</h3>
            <p class="text-xs text-gray-400 line-clamp-2">${p.description || ''}</p>
          </div>

          <div class="mt-4 flex items-center justify-between pt-2">
            <div>
              <span class="text-[10px] uppercase text-gray-400 font-bold block leading-none">Price</span>
              <span class="text-base font-extrabold text-gray-900">KES ${Number(p.price).toLocaleString()}</span>
            </div>
            <a href="https://wa.me/254700000000?text=Hello%20Apex-Hub%20Kenya,%20I%20am%20interested%20in%20${encodeURIComponent(p.title)}" target="_blank" class="bg-purple-50 hover:bg-purple-100 text-purple-700 px-4 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 border border-purple-100">
              View <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </a>
          </div>

          ${adminControls}
        `;
        grid.appendChild(card);
      });
    }

    async function handleProductSubmit(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveProdBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = "Publishing...";

      const prodId = document.getElementById('productId').value;
      const selectedCat = document.getElementById('prodCategory').value;
      const customCat = document.getElementById('customCatInput').value.trim();
      const finalCat = (selectedCat === 'CUSTOM' ? customCat : selectedCat).toUpperCase();

      const data = {
        title: document.getElementById('prodTitle').value,
        category: finalCat,
        price: document.getElementById('prodPrice').value,
        image: document.getElementById('prodImage').value.trim() || 'https://i.ibb.co/kgpDWKbw/1000006379.jpg',
        description: document.getElementById('prodDesc').value
      };

      const url = prodId ? `${DB_BASE}/${prodId}.json` : `${DB_BASE}.json`;
      const method = prodId ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          alert(prodId ? "Product updated!" : "Product published!");
          resetForm();
          fetchProducts();
        } else {
          alert("Failed to publish. Ensure Firebase rules are set to .write: true.");
        }
      } catch (err) {
        alert("Network error.");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Publish Product";
      }
    }

    function editProduct(id) {
      const p = rawProducts[id];
      if (!p) return;

      document.getElementById('productId').value = id;
      document.getElementById('prodTitle').value = p.title || '';
      document.getElementById('prodPrice').value = p.price || '';
      document.getElementById('prodImage').value = p.image || '';
      document.getElementById('prodDesc').value = p.description || '';

      const select = document.getElementById('prodCategory');
      let found = false;
      for (let i = 0; i < select.options.length; i++) {
        if (select.options[i].value === p.category) {
          select.selectedIndex = i;
          found = true;
          break;
        }
      }

      if (!found) {
        select.value = 'CUSTOM';
        toggleCustomCategory('CUSTOM');
        document.getElementById('customCatInput').value = p.category || '';
      } else {
        toggleCustomCategory(select.value);
      }

      document.getElementById('formHeaderTitle').textContent = "Edit Product Details";
      document.getElementById('saveProdBtn').textContent = "Update Product";
      document.getElementById('adminSection').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteProduct(id) {
      if (!confirm("Delete this product?")) return;

      try {
        const res = await fetch(`${DB_BASE}/${id}.json`, { method: 'DELETE' });
        if (res.ok) {
          alert("Product deleted!");
          fetchProducts();
        } else {
          alert("Failed to delete.");
        }
      } catch (err) {
        alert("Network error.");
      }
    }

    function resetForm() {
      document.getElementById('productForm').reset();
      document.getElementById('productId').value = '';
      document.getElementById('customCatInput').classList.add('hidden');
      document.getElementById('formHeaderTitle').textContent = "Admin Control Center";
      document.getElementById('saveProdBtn').textContent = "Publish Product";
    }

    function setCategoryFilter(cat) {
      activeCategory = cat;
      updateFilterButtons();
      renderProducts();
    }

    fetchProducts();
  </script>
</body>
</html>
