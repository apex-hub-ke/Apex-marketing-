<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex-Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; color: #1a1a1a; padding-bottom: 40px; }
    header { background: #0f172a; color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; font-weight: bold; color: #10b981; }
    .tagline { background: #1e293b; color: #94a3b8; text-align: center; padding: 12px; font-size: 14px; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 220px; object-fit: cover; background: #e2e8f0; }
    .card-body { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .category { font-size: 12px; font-weight: bold; color: #059669; text-transform: uppercase; margin-bottom: 6px; }
    .title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #0f172a; }
    .desc { font-size: 13px; color: #64748b; margin-bottom: 12px; line-height: 1.4; }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .price { font-size: 18px; font-weight: bold; color: #0f172a; }
    .btn-order { background: #10b981; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .empty { text-align: center; padding: 40px; color: #64748b; width: 100%; }
  </style>

  <!-- Firebase App & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <h1>🛍️ Apex-Hub</h1>
  </header>
  <div class="tagline">Quality Home Appliances & Electronics Delivered Across Kenya</div>

  <div class="container">
    <div id="productGrid" class="grid">
      <div class="empty">Loading products live...</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAHX1af6NlsfsPP9BYWHNPb6SmLTKQnqH8",
      authDomain: "apex-hub-c6d50.firebaseapp.com",
      databaseURL: "https://apex-hub-c6d50-default-rtdb.firebaseio.com",
      projectId: "apex-hub-c6d50",
      storageBucket: "apex-hub-c6d50.firebasestorage.app",
      messagingSenderId: "508890619708",
      appId: "1:508890619708:web:8a098b59c55b1e78ae483",
      measurementId: "G-NDWZS5ZWTH"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('products').on('value', (snapshot) => {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        grid.innerHTML = '<div class="empty">No products available yet. Add items via admin.html!</div>';
        return;
      }

      Object.keys(data).reverse().forEach(key => {
        const item = data[key];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/300'}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300'">
          <div class="card-body">
            <div>
              <div class="category">${item.category || 'General'}</div>
              <div class="title">${item.title}</div>
              <div class="desc">${item.description || ''}</div>
            </div>
            <div class="price-row">
              <div class="price">KES ${Number(item.price).toLocaleString()}</div>
              <a class="btn-order" href="https://wa.me/254700000000?text=Hi%2C%20I%20want%20to%20order%20${encodeURIComponent(item.title)}" target="_blank">Order</a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    });
  </script>
</body>
</html>
