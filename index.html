<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex-Hub Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-black tracking-wider text-purple-900 uppercase">Apex<span class="text-indigo-600">-Hub</span></h1>
      <button onclick="openAdminAuth()" class="bg-purple-700 hover:bg-purple-800 text-white font-semibold px-4 py-2 rounded-lg text-sm flex items-center gap-2 shadow">
        <i class="fa-solid fa-user-shield"></i>
        <span>Admin Dashboard</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- Admin Panel -->
    <section id="adminSection" class="hidden bg-white p-6 rounded-2xl shadow-lg border border-purple-100 mb-8">
      <div class="flex justify-between items-center mb-6 pb-3 border-b border-gray-100">
        <div>
          <h2 class="text-xl font-bold text-gray-900">Admin Control Center</h2>
          <p class="text-xs text-gray-500">Manage catalog inventory & settings</p>
        </div>
        <button onclick="closeAdminPanel()" class="text-gray-400 hover:text-gray-600 font-bold text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="productForm" onsubmit="handleProductSubmit(event)" class="space-y-4">
        <input type="hidden" id="productId">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Product Title</label>
            <input type="text" id="prodTitle" required placeholder="e.g. Ecomax Standing Cooker" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Category</label>
            <select id="prodCategory" required onchange="toggleCustomCategory(this.value)" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm bg-white">
              <option value="Kitchen">Kitchen Appliances</option>
              <option value="Home">Home Appliances</option>
              <option value="Electronics">Electronics</option>
              <option value="Furniture">Furniture</option>
              <option value="CUSTOM">+ Add New Category...</option>
            </select>
            <input type="text" id="customCatInput" placeholder="Type new category name" class="hidden w-full mt-2 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Price (KES)</label>
            <input type="number" id="prodPrice" required placeholder="14500" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Product Image URL</label>
            <input type="url" id="prodImage" placeholder="https://i.ibb.co/..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Description</label>
          <textarea id="prodDesc" rows="3" required placeholder="Describe product details..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm"></textarea>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" id="saveProdBtn" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-6 py-2.5 rounded-lg text-sm shadow transition flex-1">
            Publish Product
          </button>
          <button type="button" onclick="resetForm()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-4 py-2.5 rounded-lg text-sm transition">
            Clear Form
          </button>
        </div>
      </form>
    </section>

    <!-- Filters -->
    <div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center">
      <div class="w-full md:w-72">
        <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Search products..." class="w-full px-4 py-2 border rounded-xl shadow-sm focus:ring-2 focus:ring-purple-600 outline-none text-sm">
      </div>
      <div id="filterBar" class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
        <button onclick="setCategoryFilter('ALL')" class="cat-btn bg-purple-700 text-white font-semibold px-4 py-2 rounded-xl text-xs shrink-0 shadow">All</button>
      </div>
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-600 border-t-transparent"></div>
        <p class="mt-2 text-sm text-gray-500">Loading live products...</p>
      </div>
    </div>
  </main>

  <footer class="bg-slate-900 text-gray-400 text-center py-6 text-xs mt-auto">
    <p>&copy; Apex-Hub Kenya. All rights reserved.</p>
  </footer>

  <!-- Passcode Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-gray-900 mb-1">Admin Access Required</h3>
      <p class="text-xs text-gray-500 mb-4">Enter passcode to publish items.</p>
      <input type="password" id="passcodeInput" placeholder="Enter Admin Passcode" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600 outline-none text-sm mb-4">
      <div class="flex justify-end gap-2">
        <button onclick="closeAuthModal()" class="px-4 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
        <button onclick="verifyPasscode()" class="px-4 py-2 text-xs font-semibold bg-purple-700 text-white rounded-lg shadow hover:bg-purple-800">Unlock</button>
      </div>
    </div>
  </div>

  <script>
    const DB_URL = "https://apex-hub-default-rtdb.firebaseio.com/products.json";
    let rawProducts = {};
    let activeCategory = 'ALL';
    let isAdminAuthenticated = false;

    function openAdminAuth() {
      if (isAdminAuthenticated) {
        document.getElementById('adminSection').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        document.getElementById('authModal').classList.remove('hidden');
      }
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('passcodeInput').value = '';
    }

    function verifyPasscode() {
      if (document.getElementById('passcodeInput').value === "Milano254!+") {
        isAdminAuthenticated = true;
        closeAuthModal();
        document.getElementById('adminSection').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderProducts();
      } else {
        alert("Incorrect passcode!");
      }
    }

    function closeAdminPanel() {
      document.getElementById('adminSection').classList.add('hidden');
    }

    function toggleCustomCategory(val) {
      const customInput = document.getElementById('customCatInput');
      if (val === 'CUSTOM') {
        customInput.classList.remove('hidden');
        customInput.required = true;
      } else {
        customInput.classList.add('hidden');
        customInput.required = false;
      }
    }

    async function fetchProducts() {
      try {
        const res = await fetch(DB_URL);
        const data = await res.json();
        rawProducts = data || {};
        updateFilterButtons();
        renderProducts();
      } catch (err) {
        document.getElementById('productGrid').innerHTML = '<div class="col-span-full text-center py-12 text-gray-400">Error connecting to database.</div>';
      }
    }

    function updateFilterButtons() {
      const filterBar = document.getElementById('filterBar');
      const categories = new Set(['Kitchen', 'Home', 'Electronics', 'Furniture']);
      
      Object.values(rawProducts || {}).forEach(p => {
        if (p && p.category) categories.add(p.category);
      });

      let buttonsHTML = `<button onclick="setCategoryFilter('ALL')" class="cat-btn ${activeCategory === 'ALL' ? 'bg-purple-700 text-white' : 'bg-white text-gray-600'} font-semibold px-4 py-2 rounded-xl text-xs shrink-0 shadow-sm border">All</button>`;

      categories.forEach(cat => {
        buttonsHTML += `<button onclick="setCategoryFilter('${cat}')" class="cat-btn ${activeCategory === cat ? 'bg-purple-700 text-white' : 'bg-white text-gray-600'} font-semibold px-4 py-2 rounded-xl text-xs shrink-0 shadow-sm border">${cat}</button>`;
      });

      filterBar.innerHTML = buttonsHTML;
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      let keys = Object.keys(rawProducts || {});

      keys = keys.filter(id => {
        const p = rawProducts[id];
        return p && p.title && String(p.title).trim() !== '';
      });

      if (keys.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400">No products found. Use Admin Dashboard to publish!</div>';
        return;
      }

      keys.forEach(id => {
        const p = rawProducts[id];
        if (!p) return;

        if (activeCategory !== 'ALL' && p.category !== activeCategory) return;
        if (searchTerm && !p.title.toLowerCase().includes(searchTerm) && !(p.description && p.description.toLowerCase().includes(searchTerm))) return;

        const imgSrc = p.image && p.image.trim() !== '' ? p.image : 'https://i.ibb.co/kgpDWKbw/1000006379.jpg';

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition";
        card.innerHTML = `
          <div>
            <div class="relative h-48 bg-gray-50 flex items-center justify-center overflow-hidden">
              <span class="absolute top-3 left-3 bg-purple-700 text-white text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider">${p.category || 'General'}</span>
              <img src="${imgSrc}" alt="${p.title}" class="object-cover w-full h-full" onerror="this.src='https://i.ibb.co/kgpDWKbw/1000006379.jpg'">
            </div>
            <div class="p-4">
              <h3 class="font-bold text-gray-900 text-base line-clamp-1 mb-1">${p.title}</h3>
              <p class="text-xs text-gray-500 line-clamp-2 mb-3">${p.description || ''}</p>
            </div>
          </div>
          <div class="p-4 pt-0 border-t border-gray-50 flex items-center justify-between mt-auto">
            <div>
              <span class="text-[10px] uppercase text-gray-400 font-bold block">Price</span>
              <span class="text-base font-extrabold text-purple-900">KES ${Number(p.price).toLocaleString()}</span>
            </div>
            <div class="flex gap-2">
              <a href="https://wa.me/254700000000?text=Hello%20Apex-Hub%20Kenya,%20I%20am%20interested%20in%20${encodeURIComponent(p.title)}" target="_blank" class="bg-purple-700 hover:bg-purple-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow">
                Order <i class="fa-brands fa-whatsapp"></i>
              </a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function handleProductSubmit(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveProdBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = "Publishing...";

      const selectedCat = document.getElementById('prodCategory').value;
      const customCat = document.getElementById('customCatInput').value.trim();
      const finalCat = selectedCat === 'CUSTOM' ? customCat : selectedCat;

      const data = {
        title: document.getElementById('prodTitle').value,
        category: finalCat,
        price: document.getElementById('prodPrice').value,
        image: document.getElementById('prodImage').value.trim() || 'https://i.ibb.co/kgpDWKbw/1000006379.jpg',
        description: document.getElementById('prodDesc').value
      };

      try {
        const res = await fetch(DB_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          alert("Product published successfully!");
          resetForm();
          fetchProducts();
        } else {
          alert("Failed to publish. Check Firebase rules.");
        }
      } catch (err) {
        alert("Network error while publishing.");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Publish Product";
      }
    }

    function resetForm() {
      document.getElementById('productForm').reset();
      document.getElementById('productId').value = '';
      document.getElementById('customCatInput').classList.add('hidden');
    }

    function setCategoryFilter(cat) {
      activeCategory = cat;
      updateFilterButtons();
      renderProducts();
    }

    fetchProducts();
  </script>
</body>
</html>
