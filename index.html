<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex-Hub | E-Commerce Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- TOP HEADER / NAV -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-store text-emerald-400 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">Apex-Hub</h1>
      </div>
      <div class="flex items-center gap-4 text-xs text-slate-400 font-medium">
        <i class="fa-solid fa-truck-fast text-emerald-400"></i> Fast Delivery Across Kenya
      </div>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="bg-gradient-to-r from-slate-900 via-slate-800 to-emerald-950 text-white py-10 px-4 text-center">
    <h2 class="text-3xl sm:text-4xl font-extrabold mb-2">Welcome to Apex-Hub</h2>
    <p class="text-slate-300 max-w-xl mx-auto text-sm sm:text-base">Quality Home Appliances & Electronics Delivered Across Kenya.</p>
  </section>

  <!-- MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <!-- SEARCH & FILTER BAR -->
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8">
      <div id="categoryTabs" class="flex flex-wrap gap-2"></div>
      <div class="relative w-full sm:w-64">
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search products..." class="w-full pl-9 pr-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
      </div>
    </div>

    <!-- PRODUCTS GRID -->
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm mt-auto">
    <p>&copy; 2026 Apex-Hub. All Rights Reserved. Kenya.</p>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const defaultCatalog = [
      {
        id: "1",
        title: "Hisense 9Kg Top Load Fully Automatic Washing Machine",
        price: 37500,
        category: "Home Appliances",
        image: "IMG-20261021-WA0000.jpg",
        description: "Hisense 9Kg Top Load Fully Automatic Washing Machine with Smart Control and Extra Care technology."
      }
    ];

    let products = JSON.parse(localStorage.getItem('apex_products')) || defaultCatalog;
    let selectedCategory = "All";
    let searchQuery = "";

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";

      const filtered = products.filter(p => {
        const matchesCategory = selectedCategory === "All" || p.category === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No products found.</div>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition flex flex-col";
        card.innerHTML = `
          <div class="h-48 bg-slate-100 overflow-hidden flex items-center justify-center p-2">
            <img src="${p.image}" alt="${p.title}" class="max-h-full max-w-full object-contain" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
          </div>
          <div class="p-4 flex flex-col flex-grow">
            <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wider mb-1">${p.category}</span>
            <h3 class="font-bold text-slate-800 text-base mb-2 line-clamp-2">${p.title}</h3>
            <p class="text-xs text-slate-500 mb-4 line-clamp-2 flex-grow">${p.description || ''}</p>
            <div class="flex items-center justify-between mt-auto pt-2 border-t border-slate-100">
              <span class="text-lg font-extrabold text-slate-900">KES ${Number(p.price).toLocaleString()}</span>
              <a href="https://wa.me/254700000000?text=Hello%20Apex-Hub,%20I%20want%20to%20order:%20${encodeURIComponent(p.title)}" target="_blank" class="bg-emerald-600 text-white text-xs px-3 py-2 rounded-lg font-medium hover:bg-emerald-500 transition flex items-center gap-1.5">
                <i class="fa-brands fa-whatsapp text-sm"></i> Order
              </a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderCategoryTabs() {
      const categories = ["All", ...new Set(products.map(p => p.category))];
      const container = document.getElementById("categoryTabs");
      container.innerHTML = categories.map(cat => `
        <button onclick="filterCategory('${cat}')" class="px-3.5 py-1.5 rounded-full text-xs font-medium transition ${selectedCategory === cat ? 'bg-emerald-900 text-amber-400 font-bold' : 'bg-white text-slate-600 hover:bg-slate-200'}">
          ${cat}
        </button>
      `).join('');
    }

    function filterCategory(cat) {
      selectedCategory = cat;
      renderCategoryTabs();
      renderProducts();
    }

    function handleSearch() {
      searchQuery = document.getElementById("searchInput").value;
      renderProducts();
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderCategoryTabs();
      renderProducts();
    });
  </script>
</body>
</html>
