<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex-Hub | Quality Home Appliances & Electronics Kenya</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --primary: #0d9488;
            --primary-hover: #0f766e;
            --whatsapp-green: #25d366;
            --whatsapp-hover: #1da851;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 50px;
        }

        /* Top Notification Bar */
        .top-banner {
            background: linear-gradient(90deg, #0f766e, #0d9488);
            color: #ffffff;
            text-align: center;
            padding: 8px 15px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Sticky Navigation Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-logo i {
            color: var(--primary);
            font-size: 1.8rem;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 450px;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Hero Container */
        .hero {
            max-width: 1200px;
            margin: 20px auto 10px auto;
            padding: 0 20px;
        }

        .hero-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .hero-text h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 600px;
        }

        /* Category Filter Pills */
        .categories-wrapper {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-pills {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: thin;
        }

        .category-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 30px;
            white-space: nowrap;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-btn.active, .category-btn:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Product Grid */
        .main-container {
            max-width: 1200px;
            margin: 10px auto;
            padding: 0 20px;
            flex: 1;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .card-img-wrapper {
            width: 100%;
            height: 220px;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .product-card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .category-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(13, 148, 136, 0.3);
            text-transform: uppercase;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
            color: #ffffff;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Variant Selection Chips */
        .variants-section {
            margin-bottom: 12px;
        }

        .variant-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .variant-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .chip.active {
            border-color: var(--primary);
            background-color: rgba(13, 148, 136, 0.15);
            color: var(--primary);
        }

        .card-footer {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .price-display {
            display: flex;
            flex-direction: column;
        }

        .currency {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .amount {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .btn-order {
            background-color: var(--whatsapp-green);
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-order:hover {
            background-color: var(--whatsapp-hover);
        }

        /* Loading & Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--border-color);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Top Banner -->
    <div class="top-banner">
        <i class="fa-solid fa-truck-fast"></i> Fast Delivery Across Kenya | Direct WhatsApp Orders
    </div>

    <!-- Sticky Header -->
    <header>
        <div class="header-container">
            <a href="#" class="brand-logo">
                <i class="fa-solid fa-store"></i> Apex-Hub
            </a>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search kettles, coffee makers, machines..." oninput="filterProducts()">
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <div class="hero">
        <div class="hero-banner">
            <div class="hero-text">
                <h1>Premium Home Appliances</h1>
                <p>Browse quality electronics and order directly via WhatsApp for instant response and speedy delivery.</p>
            </div>
        </div>
    </div>

    <!-- Categories Filter Bar -->
    <div class="categories-wrapper">
        <div class="category-title">
            <i class="fa-solid fa-layer-group"></i> Categories
        </div>
        <div class="category-pills" id="categoryPills">
            <button class="category-btn active" onclick="selectCategory('All')">All Items</button>
            <button class="category-btn" onclick="selectCategory('Kitchen Appliances')">Kitchen Appliances</button>
            <button class="category-btn" onclick="selectCategory('Electronics')">Electronics</button>
            <button class="category-btn" onclick="selectCategory('Home & Office')">Home & Office</button>
        </div>
    </div>

    <!-- Main Product Grid Section -->
    <div class="main-container">
        <div class="product-grid" id="productGrid">
            <div class="empty-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading inventory...</p>
            </div>
        </div>
    </div>

    <script>
        // WhatsApp Configuration
        const WHATSAPP_NUMBER = "254707913881";

        // Firebase Realtime Database Config
        const firebaseConfig = {
            databaseURL: "https://apex-hub-c6d50-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allProducts = [];
        let selectedCategory = "All";

        // Load Products from Firebase
        db.ref('products').on('value', (snapshot) => {
            allProducts = [];
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    allProducts.push({ id: key, ...data[key] });
                });
            }
            renderProducts();
        });

        function selectCategory(category) {
            selectedCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === category || (category === 'All' && btn.innerText === 'All Items'));
            });
            renderProducts();
        }

        function filterProducts() {
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allProducts.filter(p => {
                const matchesSearch = p.name?.toLowerCase().includes(searchTerm) || p.description?.toLowerCase().includes(searchTerm);
                const matchesCategory = selectedCategory === "All" || p.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fa-solid fa-box-open"></i>
                        <p>No products found matching your search.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(product => {
                const hasVariants = product.variants && product.variants.length > 0;
                const initialPrice = hasVariants ? product.variants[0].price : product.price;

                return `
                    <div class="product-card" id="card-${product.id}">
                        <div class="card-img-wrapper">
                            <span class="category-tag">${product.category || 'General'}</span>
                            <img src="${product.imageUrl || 'https://via.placeholder.com/300'}" alt="${product.name}">
                        </div>
                        <div class="card-body">
                            <div class="product-title">${product.name}</div>
                            <div class="product-desc">${product.description || 'No description available.'}</div>
                            
                            ${hasVariants ? `
                                <div class="variants-section">
                                    <span class="variant-label">Select Option / Capacity:</span>
                                    <div class="variant-chips">
                                        ${product.variants.map((v, index) => `
                                            <div class="chip ${index === 0 ? 'active' : ''}" 
                                                 onclick="changeVariant('${product.id}', '${v.name}', ${v.price}, this)">
                                                ${v.name}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <div class="card-footer">
                                <div class="price-display">
                                    <span class="currency">KES</span>
                                    <span class="amount" id="price-${product.id}">${Number(initialPrice).toLocaleString()}</span>
                                </div>
                                <a id="btn-${product.id}" href="${buildWhatsAppLink(product.name, hasVariants ? product.variants[0].name : '', initialPrice)}" 
                                   target="_blank" class="btn-order">
                                    <i class="fa-brands fa-whatsapp"></i> Order
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function changeVariant(productId, variantName, price, chipElement) {
            // Update Chip UI
            const parent = chipElement.parentElement;
            parent.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chipElement.classList.add('active');

            // Update Price Text
            document.getElementById(`price-${productId}`).innerText = Number(price).toLocaleString();

            // Update WhatsApp Order Button Link
            const product = allProducts.find(p => p.id === productId);
            const btn = document.getElementById(`btn-${productId}`);
            btn.href = buildWhatsAppLink(product.name, variantName, price);
        }

        function buildWhatsAppLink(productName, variant, price) {
            let message = `Hello Apex-Hub! I would like to order:\n- *Product:* ${productName}`;
            if (variant) {
                message += `\n- *Variant/Capacity:* ${variant}`;
            }
            message += `\n- *Price:* KES ${Number(price).toLocaleString()}\n\nPlease confirm availability and delivery details.`;

            return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
        }
    </script>
</body>
</html>
