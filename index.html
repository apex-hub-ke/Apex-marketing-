<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex-Hub Kenya | Premier Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #6b21a8;
            --primary-hover: #581c87;
            --bg: #f8fafc;
            --text: #0f172a;
            --border: #e2e8f0;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
        }

        header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
        }

        .admin-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .img-wrapper {
            width: 100%;
            height: 260px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .product-card img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .zoom-hint {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .product-card-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .buy-btn {
            margin-top: auto;
            background: #25d366;
            color: #fff;
            text-align: center;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 700;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: #fff;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        #lightboxModal {
            background: rgba(0,0,0,0.9);
            z-index: 200;
        }

        #lightboxModal img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .ai-box {
            background: #f3e8ff;
            border: 1px solid #d8b4fe;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: #fff;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .ai-btn {
            background: #9333ea;
            color: #fff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .inventory-list {
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }

        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-edit { background: var(--primary); color: #fff; border: none; padding: 0.4rem 0.75rem; border-radius: 6px; cursor: pointer; }
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 0.4rem 0.75rem; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">APEX-HUB KENYA</div>
        <button class="admin-btn" onclick="openAdminModal()">⚙️ Admin Panel</button>
    </header>

    <div class="container">
        <div id="productGrid" class="grid">Loading store inventory...</div>
    </div>

    <div id="lightboxModal" class="modal" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Product Image">
    </div>

    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Admin Store Management</h3>
                <button class="close-btn" onclick="closeAdminModal()">&times;</button>
            </div>

            <!-- Firebase Authentication Panel -->
            <div id="authBox">
                <p style="margin-bottom: 1rem;">Sign in with Admin Credentials:</p>
                <input type="email" id="adminEmail" placeholder="Admin Email">
                <input type="password" id="adminPass" placeholder="Admin Password">
                <button class="submit-btn" onclick="authenticate()">Sign In</button>
            </div>

            <div id="adminControls" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <span style="font-size: 0.85rem; color: #16a34a; font-weight: 700;">● Authenticated</span>
                    <button onclick="logoutAdmin()" style="background: none; border: none; color: #ef4444; cursor: pointer; font-weight: 600;">Sign Out</button>
                </div>

                <div class="ai-box">
                    <label style="font-weight: 700; color: #6b21a8;">⚡ AI QUICK GENERATOR</label>
                    <input type="text" id="aiInput" placeholder="e.g., 6L Roch pressure cooker 5000">
                    <button class="ai-btn" onclick="runAIGenerator()">Enhance with AI</button>
                </div>

                <input type="hidden" id="editKey">
                
                <label>PRODUCT TITLE</label>
                <input type="text" id="title" placeholder="e.g. ROCH 3.0L Electric Food Processor">

                <div class="form-row">
                    <div>
                        <label>CATEGORY</label>
                        <select id="category">
                            <option value="KITCHEN APPLIANCES">KITCHEN APPLIANCES</option>
                            <option value="HOME ELECTRONICS">HOME ELECTRONICS</option>
                            <option value="LIVING & FURNITURE">LIVING & FURNITURE</option>
                        </select>
                    </div>
                    <div>
                        <label>PRICE (KES)</label>
                        <input type="number" id="price" placeholder="3500">
                    </div>
                </div>

                <label>IMAGE LINK (DIRECT FILE URL)</label>
                <input type="text" id="imageUrl" placeholder="https://i.ibb.co/..." onchange="convertImageUrl()">

                <label>DESCRIPTION</label>
                <textarea id="description" rows="3" placeholder="Product features, power specifications..."></textarea>

                <button class="submit-btn" id="saveBtn" onclick="saveProduct()">Save Product to Database</button>

                <div class="inventory-list">
                    <h4>EXISTING STORE INVENTORY (<span id="itemCount">0</span> Items)</h4>
                    <div id="adminInventory">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://apex-hub-c6d50-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // Check Auth Status
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('adminControls').style.display = 'block';
                loadAdminInventory();
            } else {
                document.getElementById('authBox').style.display = 'block';
                document.getElementById('adminControls').style.display = 'none';
            }
        });

        function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }
        function openLightbox(url) { document.getElementById('lightboxImg').src = url; document.getElementById('lightboxModal').style.display = 'flex'; }
        function closeLightbox() { document.getElementById('lightboxModal').style.display = 'none'; }

        async function authenticate() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (err) {
                alert("Authentication Failed: " + err.message);
            }
        }

        function logoutAdmin() {
            auth.signOut();
        }

        function runAIGenerator() {
            const raw = document.getElementById('aiInput').value.trim();
            if (!raw) return alert("Please enter a brief product description first!");

            let words = raw.split(' ');
            let price = words.find(w => !isNaN(w) && Number(w) > 99) || '';
            let titleWords = words.filter(w => w !== price);
            let title = titleWords.join(' ');

            document.getElementById('title').value = title.charAt(0).toUpperCase() + title.slice(1);
            if (price) document.getElementById('price').value = price;

            let lower = raw.toLowerCase();
            let cat = 'KITCHEN APPLIANCES';
            if (lower.includes('tv') || lower.includes('woofer') || lower.includes('phone') || lower.includes('machine') || lower.includes('cooker')) {
                cat = lower.includes('cooker') ? 'KITCHEN APPLIANCES' : 'HOME ELECTRONICS';
            } else if (lower.includes('table') || lower.includes('sofa') || lower.includes('chair') || lower.includes('bed')) {
                cat = 'LIVING & FURNITURE';
            }
            document.getElementById('category').value = cat;
            document.getElementById('description').value = `• High performance ${title}\n• Built with premium quality materials\n• Energy efficient and reliable`;
        }

        function convertImageUrl() {
            let urlInput = document.getElementById('imageUrl');
            let val = urlInput.value.trim();
            if (val.includes('ibb.co/') && !val.includes('i.ibb.co/')) {
                let code = val.split('ibb.co/')[1].split('/')[0];
                urlInput.value = `https://i.ibb.co/${code}/image.jpg`;
            }
        }

        function sanitizeImage(url) {
            if (!url) return 'https://via.placeholder.com/300';
            if (url.includes('ibb.co/') && !url.includes('i.ibb.co/')) {
                let code = url.split('ibb.co/')[1].split('/')[0];
                return `https://i.ibb.co/${code}/image.jpg`;
            }
            return url;
        }

        function loadStorefront() {
            db.ref('products').on('value', snapshot => {
                const data = snapshot.val();
                const grid = document.getElementById('productGrid');
                if (!data) { grid.innerHTML = '<p>No products available.</p>'; return; }

                let html = '';
                for (let key in data) {
                    const item = data[key];
                    const name = item.name || item.title || 'Unnamed Product';
                    const price = item.price || 0;
                    const img = sanitizeImage(item.image || item.imageLink || item.imageUrl);

                    html += `
                        <div class="product-card">
                            <div class="img-wrapper" onclick="openLightbox('${img}')">
                                <img src="${img}" onerror="this.src='https://via.placeholder.com/300'">
                                <span class="zoom-hint">🔍 Tap to expand</span>
                            </div>
                            <div class="product-card-body">
                                <div class="product-title">${name}</div>
                                <div class="product-price">KES ${Number(price).toLocaleString()}</div>
                                <a class="buy-btn" href="https://wa.me/254700000000?text=I%20want%20to%20buy%20${encodeURIComponent(name)}" target="_blank">Order on WhatsApp</a>
                            </div>
                        </div>
                    `;
                }
                grid.innerHTML = html;
            });
        }

        function loadAdminInventory() {
            db.ref('products').on('value', snapshot => {
                const data = snapshot.val();
                const list = document.getElementById('adminInventory');
                const count = document.getElementById('itemCount');
                if (!data) { list.innerHTML = '<p>No products in database.</p>'; count.innerText = '0'; return; }

                const keys = Object.keys(data);
                count.innerText = keys.length;

                let html = '';
                keys.forEach(key => {
                    const item = data[key];
                    const name = item.name || item.title || 'Unnamed Product';
                    const price = item.price || 0;

                    html += `
                        <div class="inventory-item">
                            <div>
                                <strong>${name}</strong><br>
                                <small>KES ${Number(price).toLocaleString()}</small>
                            </div>
                            <div class="action-btns">
                                <button class="btn-edit" onclick="editProduct('${key}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">Edit</button>
                                <button class="btn-delete" onclick="deleteProduct('${key}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            });
        }

        async function saveProduct() {
            convertImageUrl();
            const key = document.getElementById('editKey').value;
            const title = document.getElementById('title').value;
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;
            const image = document.getElementById('imageUrl').value;
            const description = document.getElementById('description').value;

            if (!title || !price || !image) return alert("Please complete Title, Price, and Image URL.");

            const payload = { name: title, title: title, price: Number(price), category, image, imageLink: image, description };

            try {
                if (key) {
                    await db.ref(`products/${key}`).update(payload);
                } else {
                    await db.ref('products').push(payload);
                }
                resetForm();
                alert("Saved successfully!");
            } catch (e) {
                alert("Save failed: Make sure you are logged in!");
            }
        }

        function editProduct(key, item) {
            document.getElementById('editKey').value = key;
            document.getElementById('title').value = item.name || item.title || '';
            document.getElementById('price').value = item.price || '';
            document.getElementById('category').value = item.category || 'KITCHEN APPLIANCES';
            document.getElementById('imageUrl').value = item.image || item.imageLink || '';
            document.getElementById('description').value = item.description || '';
            document.getElementById('saveBtn').innerText = 'Update Product';
        }

        async function deleteProduct(key) {
            if (confirm("Are you sure you want to delete this product?")) {
                try {
                    await db.ref(`products/${key}`).remove();
                } catch (e) {
                    alert("Delete failed: Unauthorized!");
                }
            }
        }

        function resetForm() {
            document.getElementById('editKey').value = '';
            document.getElementById('aiInput').value = '';
            document.getElementById('title').value = '';
            document.getElementById('price').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('description').value = '';
            document.getElementById('saveBtn').innerText = 'Save Product to Database';
        }

        loadStorefront();
    </script>
</body>
</html>
