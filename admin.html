<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex-Hub | AI Product Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --primary: #8b5cf6;
            --accent: #d946ef;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1rem;
        }

        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.85rem 1.25rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger { background: var(--danger); }

        .dashboard {
            max-width: 800px;
            margin: 0 auto;
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--panel-border);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .product-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }

        .product-img {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
            background: #1e293b;
        }

        .product-info { flex: 1; }

        .product-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .product-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            width: auto;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="authScreen" class="auth-container">
        <div class="logo" style="margin-bottom: 1rem;">APEX-HUB KENYA</div>
        <h2 style="margin-bottom:0.5rem;">Admin Access</h2>
        <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1.5rem;">Enter passcode to manage store</p>
        <input type="password" id="passcode" placeholder="Enter Admin Passcode">
        <button class="btn" onclick="authenticate()">Unlock Dashboard</button>
    </div>

    <div id="dashboard" class="dashboard">
        <header>
            <div class="logo">⚡ Apex-Hub Inventory Manager</div>
            <button class="btn btn-danger btn-sm" onclick="logout()">Lock</button>
        </header>

        <div class="card">
            <h3 style="margin-bottom:1rem;">➕ Add / Edit Product</h3>
            <input type="hidden" id="editKey">
            
            <label style="font-size: 0.8rem; color: var(--text-muted);">Product Title / Name</label>
            <input type="text" id="title" placeholder="e.g., ROCH 6.0L Electric Pressure Cooker">

            <div class="grid-2">
                <div>
                    <label style="font-size: 0.8rem; color: var(--text-muted);">Price (KES)</label>
                    <input type="number" id="price" placeholder="5000">
                </div>
                <div>
                    <label style="font-size: 0.8rem; color: var(--text-muted);">Category</label>
                    <select id="category">
                        <option value="KITCHEN APPLIANCES">KITCHEN APPLIANCES</option>
                        <option value="HOME ELECTRONICS">HOME ELECTRONICS</option>
                        <option value="LIVING & FURNITURE">LIVING & FURNITURE</option>
                    </select>
                </div>
            </div>

            <label style="font-size: 0.8rem; color: var(--text-muted);">Image URL (Direct link or ibb.co)</label>
            <input type="text" id="imageUrl" placeholder="https://i.ibb.co/..." onchange="convertImageUrl()">

            <label style="font-size: 0.8rem; color: var(--text-muted);">Description</label>
            <textarea id="description" rows="3" placeholder="Product details..."></textarea>

            <button class="btn" id="saveBtn" onclick="saveProduct()">Publish to Store</button>
        </div>

        <div class="card">
            <h3 style="margin-bottom:1rem;">📦 Store Inventory (<span id="itemCount">0</span>)</h3>
            <div id="inventoryList">Loading items...</div>
        </div>
    </div>

    <script>
        const DB_URL = "https://apex-hub-c6d50-default-rtdb.firebaseio.com/products";
        const PASSCODE = "Milano254!+";

        function authenticate() {
            if (document.getElementById('passcode').value === PASSCODE) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadProducts();
            } else {
                alert("Incorrect Passcode!");
            }
        }

        function logout() {
            document.getElementById('authScreen').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        function convertImageUrl() {
            let urlInput = document.getElementById('imageUrl');
            let val = urlInput.value.trim();

            if (val.includes('ibb.co/') && !val.includes('i.ibb.co/')) {
                let code = val.split('ibb.co/')[1].split('/')[0];
                urlInput.value = `https://i.ibb.co/${code}/image.jpg`;
            }
        }

        async function loadProducts() {
            const listContainer = document.getElementById('inventoryList');
            const countSpan = document.getElementById('itemCount');
            listContainer.innerHTML = 'Loading inventory...';

            try {
                const res = await fetch(`${DB_URL}.json`);
                const data = await res.json();

                if (!data) {
                    listContainer.innerHTML = '<p style="color:var(--text-muted);">No products in database.</p>';
                    countSpan.innerText = '0';
                    return;
                }

                const keys = Object.keys(data);
                countSpan.innerText = keys.length;

                let html = '';
                keys.forEach(key => {
                    const item = data[key];
                    const name = item.name || item.title || item.productName || 'Unnamed Product';
                    const price = item.price || 0;
                    const cat = item.category || 'General';
                    
                    let img = item.image || item.imageLink || item.imageUrl || 'https://via.placeholder.com/60';
                    if (img.includes('ibb.co/') && !img.includes('i.ibb.co/')) {
                        let code = img.split('ibb.co/')[1].split('/')[0];
                        img = `https://i.ibb.co/${code}/image.jpg`;
                    }

                    html += `
                        <div class="product-item">
                            <img src="${img}" class="product-img" onerror="this.src='https://via.placeholder.com/60'">
                            <div class="product-info">
                                <div class="product-name">${name}</div>
                                <div class="product-meta">KES ${Number(price).toLocaleString()} | ${cat}</div>
                            </div>
                            <div class="action-btns">
                                <button class="btn btn-sm" onclick="editProduct('${key}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteProduct('${key}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } catch (e) {
                listContainer.innerHTML = '<p style="color:var(--danger);">Failed to load inventory.</p>';
            }
        }

        async function saveProduct() {
            convertImageUrl();
            const key = document.getElementById('editKey').value;
            const title = document.getElementById('title').value;
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;
            const image = document.getElementById('imageUrl').value;
            const description = document.getElementById('description').value;

            if (!title || !price || !image) {
                alert("Please fill in Title, Price, and Image URL.");
                return;
            }

            const payload = { 
                name: title, 
                title: title, 
                price: Number(price), 
                category: category, 
                image: image, 
                imageLink: image, 
                description: description 
            };

            const method = key ? 'PUT' : 'POST';
            const url = key ? `${DB_URL}/${key}.json` : `${DB_URL}.json`;

            await fetch(url, {
                method: method,
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'application/json' }
            });

            resetForm();
            loadProducts();
            alert("Saved successfully!");
        }

        function editProduct(key, item) {
            document.getElementById('editKey').value = key;
            document.getElementById('title').value = item.name || item.title || item.productName || '';
            document.getElementById('price').value = item.price || '';
            document.getElementById('category').value = item.category || 'KITCHEN APPLIANCES';
            document.getElementById('imageUrl').value = item.image || item.imageLink || item.imageUrl || '';
            document.getElementById('description').value = item.description || '';
            document.getElementById('saveBtn').innerText = 'Update Product';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteProduct(key) {
            if (confirm("Are you sure you want to delete this product?")) {
                await fetch(`${DB_URL}/${key}.json`, { method: 'DELETE' });
                loadProducts();
            }
        }

        function resetForm() {
            document.getElementById('editKey').value = '';
            document.getElementById('title').value = '';
            document.getElementById('price').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('description').value = '';
            document.getElementById('saveBtn').innerText = 'Publish to Store';
        }
    </script>
</body>
</html>
