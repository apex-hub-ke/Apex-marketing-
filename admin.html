<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex-Hub Admin Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #161b22; padding: 24px; border-radius: 12px; border: 1px solid #30363d; }
    h1 { color: #58a6ff; font-size: 24px; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; margin-bottom: 6px; color: #8b949e; }
    input, select, textarea { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 15px; }
    .or-divider { text-align: center; color: #8b949e; font-size: 12px; margin: 8px 0; font-weight: bold; }
    button { width: 100%; padding: 14px; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #2ea043; }
    button:disabled { background: #30363d; cursor: not-allowed; }
    .status { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; display: none; }
    .status.success { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #238636; }
    .status.error { background: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid #f85149; }
  </style>

  <!-- Firebase App, Database & Storage SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body>

  <div class="container">
    <h1>Apex-Hub Admin Portal</h1>
    <form id="productForm">
      <div class="form-group">
        <label for="title">Product Name</label>
        <input type="text" id="title" required placeholder="e.g., Nunix Coffee Maker">
      </div>
      <div class="form-group">
        <label for="price">Price (KES)</label>
        <input type="number" id="price" required placeholder="e.g., 3000">
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="Home Appliances">Home Appliances</option>
          <option value="Kitchen Appliances">Kitchen Appliances</option>
          <option value="Hair Care & Beauty">Hair Care & Beauty</option>
          <option value="Electronics">Electronics</option>
        </select>
      </div>
      
      <!-- Upload options: Device Gallery or Web Link -->
      <div class="form-group">
        <label for="imageFile">Upload Image from Device Gallery</label>
        <input type="file" id="imageFile" accept="image/*">
      </div>
      <div class="or-divider">— OR —</div>
      <div class="form-group">
        <label for="image">Image Web URL</label>
        <input type="url" id="image" placeholder="https://...">
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Brief description of the product..."></textarea>
      </div>
      <button type="submit" id="submitBtn">Publish Product Live</button>
    </form>
    <div id="statusMsg" class="status"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAHX1af6NlsfsPP9BYWHNPb6SmLTKQnqH8",
      authDomain: "apex-hub-c6d50.firebaseapp.com",
      databaseURL: "https://apex-hub-c6d50-default-rtdb.firebaseio.com",
      projectId: "apex-hub-c6d50",
      storageBucket: "apex-hub-c6d50.firebasestorage.app",
      messagingSenderId: "508890619708",
      appId: "1:508890619708:web:8a098b59c55b1e78ae483",
      measurementId: "G-NDWZS5ZWTH"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    document.getElementById('productForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      const fileInput = document.getElementById('imageFile');
      const urlInput = document.getElementById('image').value;
      const file = fileInput.files[0];

      if (!file && !urlInput) {
        alert("Please select an image file from your device OR paste an image URL.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Uploading & Publishing...";

      try {
        let imageUrl = urlInput;

        // Upload file to Firebase Storage if selected from gallery
        if (file) {
          const storageRef = storage.ref('products/' + Date.now() + '_' + file.name);
          const snapshot = await storageRef.put(file);
          imageUrl = await snapshot.ref.getDownloadURL();
        }

        const newProduct = {
          title: document.getElementById('title').value,
          price: Number(document.getElementById('price').value),
          category: document.getElementById('category').value,
          image: imageUrl,
          description: document.getElementById('description').value,
          createdAt: Date.now()
        };

        const newRef = db.ref('products').push();
        await newRef.set(newProduct);

        statusMsg.className = "status success";
        statusMsg.innerText = "Product published live successfully!";
        statusMsg.style.display = "block";
        document.getElementById('productForm').reset();
        submitBtn.disabled = false;
        submitBtn.innerText = "Publish Product Live";
        setTimeout(() => { statusMsg.style.display = "none"; }, 4000);

      } catch (error) {
        statusMsg.className = "status error";
        statusMsg.innerText = "Error: " + error.message;
        statusMsg.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.innerText = "Publish Product Live";
      }
    });
  </script>
</body>
</html>
