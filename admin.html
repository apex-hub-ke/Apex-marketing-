<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex-Hub | Admin Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased">

  <!-- HEADER / NAVIGATION -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 p-2 rounded-xl">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-tight text-white">Apex-Hub <span class="text-xs bg-emerald-500/20 text-emerald-300 font-semibold px-2 py-0.5 rounded-full border border-emerald-500/30">ADMIN</span></h1>
          <p class="text-xs text-slate-400">Inventory & Store Operations</p>
        </div>
      </div>
      <div id="navRight" class="hidden">
        <button onclick="logout()" class="flex items-center gap-2 bg-slate-800 hover:bg-red-500/10 hover:text-red-400 border border-slate-700 hover:border-red-500/30 text-slate-300 text-xs font-semibold px-3.5 py-2 rounded-xl transition">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl w-full mx-auto p-4 flex-1 flex flex-col justify-center">

    <!-- LOGIN PANEL -->
    <section id="loginSection" class="max-w-md w-full mx-auto my-auto py-10">
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>
        
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
            <i class="fa-solid fa-lock"></i>
          </div>
          <h2 class="text-2xl font-bold text-white tracking-tight">System Login</h2>
          <p class="text-xs text-slate-400 mt-1">Enter master credential to access administrative dashboard</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5">Master Key Password</label>
            <div class="relative">
              <input type="password" id="adminPass" placeholder="••••••••" required class="w-full bg-slate-900 border border-slate-800 focus:border-emerald-500 text-white placeholder-slate-600 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500 transition">
              <i class="fa-solid fa-key absolute right-3.5 top-3.5 text-slate-600 text-xs"></i>
            </div>
          </div>
          <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-500/10">
            Authenticate & Open Portal
          </button>
        </form>
      </div>
    </section>

    <!-- DASHBOARD PANEL (HIDDEN BY DEFAULT) -->
    <section id="dashboardSection" class="hidden space-y-6 my-6">

      <!-- METRICS HEADER -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl flex items-center gap-4">
          <div class="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center text-xl">
            <i class="fa-solid fa-boxes-stacked"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400">Total Catalog Items</p>
            <h3 id="statTotal" class="text-xl font-bold text-white">0</h3>
          </div>
        </div>

        <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl flex items-center gap-4">
          <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl">
            <i class="fa-solid fa-tags"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400">Categories Active</p>
            <h3 id="statCategories" class="text-xl font-bold text-white">0</h3>
          </div>
        </div>

        <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl flex items-center gap-4">
          <div class="w-12 h-12 bg-purple-500/10 text-purple-400 rounded-xl flex items-center justify-center text-xl">
            <i class="fa-solid fa-coins"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400">Inventory Value (Total)</p>
            <h3 id="statValue" class="text-xl font-bold text-white">KES 0</h3>
          </div>
        </div>
      </div>

      <!-- MAIN MANAGEMENT WORKSPACE -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- ADD ITEM FORM -->
        <div class="lg:col-span-5 bg-slate-950 border border-slate-800 rounded-2xl p-6 h-fit">
          <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-800">
            <i class="fa-solid fa-plus-circle text-emerald-400"></i>
            <h2 class="font-bold text-white text-base">Add New Product</h2>
          </div>

          <form onsubmit="handleAddProduct(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Product Title</label>
              <input type="text" id="pTitle" placeholder="e.g. Hisense 9Kg Washing Machine" required class="w-full bg-slate-900 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Price (KES)</label>
                <input type="number" id="pPrice" placeholder="37500" required class="w-full bg-slate-900 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Category</label>
                <input type="text" id="pCategory" placeholder="Home Appliances" required class="w-full bg-slate-900 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none">
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Image Filename or URL</label>
              <input type="text" id="pImage" placeholder="IMG-20261021-WA0000.jpg" required class="w-full bg-slate-900 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Description</label>
              <textarea id="pDesc" rows="3" placeholder="Enter key features and specs..." class="w-full bg-slate-900 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none resize-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-500/10 flex items-center justify-center gap-2">
              <i class="fa-solid fa-upload"></i>
              <span>Publish Product to Store</span>
            </button>
          </form>
        </div>

        <!-- PRODUCT CATALOG TABLE/LIST -->
        <div class="lg:col-span-7 bg-slate-950 border border-slate-800 rounded-2xl p-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-800">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-list-check text-blue-400"></i>
              <h2 class="font-bold text-white text-base">Store Catalog</h2>
            </div>
            
            <!-- SEARCH BAR -->
            <div class="relative">
              <input type="text" id="searchInput" oninput="renderAdminList()" placeholder="Search products..." class="bg-slate-900 border border-slate-800 text-xs text-white rounded-xl pl-8 pr-3 py-2 w-full sm:w-48 focus:border-blue-500 focus:outline-none">
              <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-500 text-xs"></i>
            </div>
          </div>

          <!-- DYNAMIC PRODUCT CONTAINER -->
          <div id="adminProductList" class="space-y-3 max-h-[500px] overflow-y-auto pr-1"></div>
        </div>

      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    Apex-Hub Control Center &copy; 2026. All rights reserved.
  </footer>

  <script>
    const defaultCatalog = [
      {
        id: "1",
        title: "Hisense 9Kg Top Load Fully Automatic Washing Machine",
        price: 37500,
        category: "Home Appliances",
        image: "IMG-20261021-WA0000.jpg",
        description: "Hisense 9Kg Top Load Fully Automatic Washing Machine with Smart Control and Extra Care technology."
      }
    ];

    let products = JSON.parse(localStorage.getItem('apex_products')) || defaultCatalog;

    function handleLogin(e) {
      e.preventDefault();
      const pass = document.getElementById("adminPass").value;
      if (pass === "ApexPass2026!") {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("dashboardSection").classList.remove("hidden");
        document.getElementById("navRight").classList.remove("hidden");
        renderAdminList();
      } else {
        alert("Incorrect Admin Password! Try again.");
      }
    }

    function logout() {
      document.getElementById("dashboardSection").classList.add("hidden");
      document.getElementById("navRight").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("adminPass").value = "";
    }

    function updateMetrics() {
      document.getElementById("statTotal").textContent = products.length;
      
      const categories = new Set(products.map(p => p.category.trim().toLowerCase()));
      document.getElementById("statCategories").textContent = categories.size;

      const totalVal = products.reduce((acc, curr) => acc + (Number(curr.price) || 0), 0);
      document.getElementById("statValue").textContent = "KES " + totalVal.toLocaleString();
    }

    function renderAdminList() {
      updateMetrics();
      const list = document.getElementById("adminProductList");
      const query = document.getElementById("searchInput").value.toLowerCase();
      
      list.innerHTML = "";

      const filtered = products.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="text-center py-12 text-slate-500 border border-dashed border-slate-800 rounded-xl">
            <i class="fa-solid fa-box-open text-3xl mb-2 text-slate-600"></i>
            <p class="text-xs">No matching products found.</p>
          </div>
        `;
        return;
      }

      filtered.forEach((p, index) => {
        const item = document.createElement("div");
        item.className = "flex items-center justify-between bg-slate-900/60 border border-slate-800 hover:border-slate-700 p-3.5 rounded-xl transition gap-3";
        item.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <img src="${p.image}" class="w-12 h-12 object-contain rounded-lg bg-slate-950 p-1 border border-slate-800 shrink-0" onerror="this.src='https://via.placeholder.com/100?text=Item'">
            <div class="min-w-0">
              <h4 class="font-semibold text-slate-200 text-sm truncate leading-tight">${p.title}</h4>
              <p class="text-xs text-slate-400 mt-0.5">
                <span class="text-emerald-400 font-bold">KES ${Number(p.price).toLocaleString()}</span> 
                <span class="text-slate-600 mx-1">•</span> 
                <span class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full text-[10px]">${p.category}</span>
              </p>
            </div>
          </div>
          <button onclick="deleteProduct(${index})" class="text-red-400 hover:text-red-300 hover:bg-red-500/10 p-2 rounded-lg transition border border-transparent hover:border-red-500/20 text-xs shrink-0" title="Delete Product">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        list.appendChild(item);
      });
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const newP = {
        id: Date.now().toString(),
        title: document.getElementById("pTitle").value,
        price: Number(document.getElementById("pPrice").value),
        category: document.getElementById("pCategory").value,
        image: document.getElementById("pImage").value,
        description: document.getElementById("pDesc").value
      };
      
      products.unshift(newP);
      localStorage.setItem('apex_products', JSON.stringify(products));
      renderAdminList();
      e.target.reset();
      alert("🎉 Product published successfully!");
    }

    function deleteProduct(index) {
      if (confirm("Are you sure you want to remove this product from the store catalog?")) {
        products.splice(index, 1);
        localStorage.setItem('apex_products', JSON.stringify(products));
        renderAdminList();
      }
    }
  </script>
</body>
</html>
